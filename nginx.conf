# Nginx config para GhostSpy pt-PT
# ---
# Caminho sugerido:   /etc/nginx/sites-available/ghostspy-pt
# Depois:             ln -s /etc/nginx/sites-available/ghostspy-pt /etc/nginx/sites-enabled/
# Testar:             nginx -t
# Recarregar:         systemctl reload nginx
# SSL via Certbot:    certbot --nginx -d ghostspy.site -d www.ghostspy.site

# --- Redirecionar HTTP -> HTTPS -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ghostspy.site www.ghostspy.site;
    return 301 https://ghostspy.site$request_uri;
}

# --- Redirecionar www.ghostspy.site -> ghostspy.site ----------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ghostspy.site;
    # ssl_certificate /etc/letsencrypt/live/ghostspy.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ghostspy.site/privkey.pem;
    return 301 https://ghostspy.site$request_uri;
}

# --- HTTPS ----------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ghostspy.site;

    # SSL (preenchido pelo Certbot)
    # ssl_certificate /etc/letsencrypt/live/ghostspy.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ghostspy.site/privkey.pem;

    root /var/www/ghostspy-pt;
    index index.html;

    # Segurança básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nota: o site injeta pixels e carrega fontes externas; ajuste CSP conforme necessário.

    # Checkout (página standalone, sem SPA fallback)
    location = /checkout/ {
        try_files /checkout/index.html =404;
    }
    location /checkout/ {
        try_files $uri $uri/ /checkout/index.html;
    }

    # API PHP — pagamentos + webhook + image proxy (exige php-fpm instalado)
    location ^~ /api/ {
        # Bloquear includes internos: /api/_lib/ nunca deve ser servido.
        location ~ ^/api/_lib/ { return 403; }

        # Ficheiros .php reais passam ao php-fpm.
        location ~ ^/api/.+\.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;  # ajustar versão se necessário
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 30s;
            include fastcgi_params;
        }

        # Qualquer outro pedido dentro de /api/ (ex. estáticos) — normal.
        try_files $uri =404;
    }

    # SPA: tudo o resto cai no index.html (React Router client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com cache longo (o Vite coloca hash no nome dos ficheiros)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Imagens
    location /images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Favicon
    location = /favicon.png {
        access_log off;
        expires 30d;
    }

    # Bloquear acesso a ficheiros ocultos (.env, .git, .htaccess...)
    location ~ /\. {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/ghostspy-pt.access.log;
    error_log  /var/log/nginx/ghostspy-pt.error.log;
}
